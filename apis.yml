name: Maxima
description: 'Maxima is an AI-native accounting and financial-close automation platform
  for enterprise finance teams. Its AI agents automate the core work of the accounting
  close — journal entries, cash coding, payroll entries, bank and balance-sheet reconciliations,
  flux (variance) analysis, and fixed-asset depreciation — while connecting natively
  to the systems finance teams already use (the company advertises 150+ integrations
  across ERPs, banks, and payroll providers). Maxima is an early-stage, enterprise-focused
  company backed by Kleiner Perkins. It was added to the API Evangelist network as a
  portfolio lead; as of this pass the company runs a corporate marketing site and a
  gated web application (app.maximahq.com) and does not publish a public developer API,
  developer portal, or machine-readable API surface.'
